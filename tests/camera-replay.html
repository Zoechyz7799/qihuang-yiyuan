<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作纠正联调 · 合成数据测试</title><style>body{margin:0;font:13px system-ui;background:#fff8e8;color:#8b6028}header{padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid #d9c8a8;background:white;color:#6b552f;border-radius:6px;padding:7px 12px}iframe{display:block;border:0;width:100%;height:calc(100vh - 93px)}small{display:block;padding:0 16px 10px}</style><header><b>开发验证 · 合成关节数据，非真人摄像头</b><button id="start" disabled>打开测试练习</button><button data-case="low">右手太低</button><button data-case="correct">调整正确</button><button data-case="occluded">手腕遮挡</button><button data-case="frozen">画面中断</button></header><small>使用真实练习页、纠正规则和骨骼绘图；替换相机输入，进度仅在内存中，不写入个人记录。</small><iframe id="app" title="摄像头模块开发验证"></iframe><script>
(async()=>{
const root=new URL('../',location.href).href,frame=document.getElementById('app');
const [html,app,fixtures]=await Promise.all([fetch(root+'index.html').then(r=>r.text()),fetch(root+'app.js').then(r=>r.text()),fetch('pose-fixtures.cjs').then(r=>r.text())]);
const mock=`${fixtures.replace('module.exports={fixture};','window.poseFixture=fixture;')}
window.qaCase='low';window.qaVideoTime=0;
QimaiSound={onStatus(){},settings(){},ensure(){},start(){},stop(){},speak(){},chime(){}};
const state=QimaiProgress.fresh();window.QimaiStore={get:()=>state,init:async()=>state,transaction:async fn=>fn(state)};
Object.defineProperty(navigator,'mediaDevices',{value:{getUserMedia:async()=>new MediaStream()},configurable:true});
const v=document.getElementById('video');Object.defineProperties(v,{readyState:{get:()=>4},videoWidth:{get:()=>640},videoHeight:{get:()=>480},currentTime:{get:()=>{if(qaCase!=='frozen')qaVideoTime=Math.floor(performance.now()/100)/10;return qaVideoTime;}}});v.play=async()=>{};
window.qaVision={FilesetResolver:{forVisionTasks:async()=>({})},PoseLandmarker:{createFromOptions:async()=>({detectForVideo:()=>{
const label=document.getElementById('stepLabel').textContent,phase=Number(label.match(/步骤 (\\d)/)?.[1]||1)-1,lesson=QimaiData.lessons.find(l=>l.name===document.getElementById('practiceName').textContent);const target=lesson.steps[phase].pose,f=poseFixture(target);
if(qaCase==='occluded')f.landmarks[16].visibility=.1;
if(qaCase==='low'&&target==='spread'){f.landmarks[16].y=.58;f.worldLandmarks[16].y=.018;}
return{landmarks:[f.landmarks],worldLandmarks:[f.worldLandmarks]};}})}};
QimaiTracker.create=async()=>qaVision.PoseLandmarker.createFromOptions();
`;
const scriptTag=code=>'<script>'+code+'<'+ '/script>';
frame.srcdoc=html.replace('<head>','<head><base href="'+root+'">').replace('<script src="app.js"></'+'script>',scriptTag(mock)+scriptTag(app.replace("import('./vendor/tasks-vision/vision_bundle.mjs')",'Promise.resolve(qaVision)').replaceAll('location.href','document.baseURI')));
frame.onload=()=>{document.getElementById('start').disabled=false;};
document.getElementById('start').onclick=()=>{const d=frame.contentDocument;d.querySelector('[data-mode="standing"]').click();d.querySelector('[data-train="wei1"]').click();d.getElementById('cameraToggle').click();};
document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{frame.contentWindow.qaCase=b.dataset.case;});
})();
</script></html>
