<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十二势动作检查 · 开发预览</title><style>body{background:#f7f9fd;color:#34516d;font:14px system-ui;margin:24px}h1{font-size:22px}p{color:#7087a1}#poses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}article{border:1px solid #dce7f2;border-radius:18px;overflow:hidden;background:white}canvas{width:100%;height:330px}h2{font-size:15px;padding:0 15px}button{border:1px solid #ccddeb;border-radius:8px;background:white;color:#476a8e;padding:9px 15px;margin:8px 5px 16px 0}label{margin-left:12px}input{width:180px;vertical-align:middle}@media(max-width:700px){#poses{grid-template-columns:repeat(2,minmax(0,1fr))}canvas{height:270px}}</style><h1>十二势动作检查</h1><p>开发预览：检查动画路径与左右换侧，不使用摄像头，不产生练习记录。</p><button id="play">播放完整动作</button><button id="still">查看定势</button><label>动画进度 <input id="scrub" type="range" min="0" max="20" value="8" step=".01"></label><div id="poses"></div><script src="courses.js"></script><script src="motion.js"></script><script src="companion.js"></script><script>
const container=document.getElementById('poses');QimaiData.lessons.forEach(l=>{const a=document.createElement('article');a.innerHTML='<canvas aria-label="'+l.name+'"></canvas><h2>'+l.name+'</h2>';container.append(a);});let playing=false,start=0,clock=8,still=true;
document.getElementById('play').onclick=()=>{playing=!playing;start=performance.now()-clock*1000;still=false;document.getElementById('play').textContent=playing?'暂停播放':'继续播放';};document.getElementById('still').onclick=()=>{still=true;playing=false;draw();};document.getElementById('scrub').oninput=e=>{clock=+e.target.value;playing=false;still=false;draw();};
function draw(){[...container.querySelectorAll('canvas')].forEach((c,i)=>{const l=QimaiData.lessons[i],phase=Math.min(3,Math.floor(clock/5)),step=l.steps[phase],from=phase?l.steps[phase-1].pose:'prayer';const target={wei1:'prayer',wei2:'spread',wei3:'sky',star:'starL',pull:'pullL',push:'push',knife:'knifeL',squat:'squat',claw:'clawL',tiger:'tigerL',bow:'bow',tail:'tailL'}[l.id];const chosen=l.steps.find(s=>s.pose===target);const p=still?QimaiData.poses[chosen.pose]:QimaiMotion.sample(from,step,Math.min(1,(clock%5)/2));QimaiCompanion.draw(c,p,{}, {practice:true,pose:still?chosen.pose:step.pose,instant:still,time:performance.now()});});}
function tick(t){if(playing){clock=((t-start)/1000)%20;document.getElementById('scrub').value=clock;draw();}requestAnimationFrame(tick);}window.addEventListener('qimai-avatar-ready',draw);window.addEventListener('resize',draw);draw();requestAnimationFrame(tick);
</script></html>
